services:
  fastapi:
    build: ./url-shortener/fastapi
    environment:
      DATABASE_URL: postgresql://lab:lab@postgres:5432/lab
      REDIS_URL: redis://redis:6379/0
    ports:
      - "58000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports:
      - "55432:5432"
    volumes:
      - phase2-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"

volumes:
  phase2-postgres:
