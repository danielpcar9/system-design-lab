# Render Blueprint for a reproducible production-shaped deployment.
# The free-tier Blueprint uses one Postgres database so it can deploy in
# Render workspaces that allow only one active free database. Rails and Solid
# Queue still use separate connection roles in the app configuration, but
# point to the same database here. A paid deployment can add a second DB.
# No real credentials belong in this file.
databases:
  - name: sdl-postgres
    databaseName: sdl
    user: sdl
    plan: free
    postgresMajorVersion: "16"

services:
  - type: redis
    name: sdl-redis
    plan: free
    ipAllowList: []

  - type: web
    name: sdl-fastapi
    runtime: docker
    dockerfilePath: ./labs/phase2/url-shortener/fastapi/Dockerfile
    dockerContext: ./labs/phase2/url-shortener/fastapi
    healthCheckPath: /health
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sdl-postgres
          property: connectionString
      - key: DB_SCHEMA
        value: fastapi
      - key: REDIS_URL
        fromService:
          type: redis
          name: sdl-redis
          property: connectionString
      - key: LAB_ENV
        value: production
      - key: LAB_FAULTS
        value: "0"
      - key: OTEL_TRACES_EXPORTER
        value: none
      - key: OTEL_METRICS_EXPORTER
        value: none
      - key: OTEL_LOGS_EXPORTER
        value: none

  - type: web
    name: sdl-rails
    runtime: docker
    dockerfilePath: ./labs/phase2/url-shortener/rails/Dockerfile
    dockerContext: ./labs/phase2/url-shortener/rails
    healthCheckPath: /health
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sdl-postgres
          property: connectionString
      - key: QUEUE_DATABASE_URL
        fromDatabase:
          name: sdl-postgres
          property: connectionString
      - key: RAILS_SCHEMA
        value: rails
      - key: QUEUE_SCHEMA
        value: solid_queue
      - key: REDIS_URL
        fromService:
          type: redis
          name: sdl-redis
          property: connectionString
      - key: RAILS_ENV
        value: production
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
      - key: LAB_ENV
        value: production
      - key: LAB_FAULTS
        value: "0"
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: OTEL_TRACES_EXPORTER
        value: none
      - key: OTEL_METRICS_EXPORTER
        value: none
      - key: OTEL_LOGS_EXPORTER
        value: none
