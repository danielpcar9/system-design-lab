default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("DB_HOST", "localhost") %>
  port: <%= ENV.fetch("DB_PORT", "5432") %>
  username: <%= ENV.fetch("POSTGRES_USER", "lab") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "lab") %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_DB", "lab") %>

test:
  <<: *default
  database: <%= ENV.fetch("POSTGRES_TEST_DB", "lab_test") %>

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DB", "lab") %>
  queue:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_QUEUE_DB", "lab_queue") %>
    migrations_paths: db/queue_migrate
