[project]
name = "url-shortener-fastapi-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "redis>=5,<6",
  "opentelemetry-api>=1.26.0,<2",
  "opentelemetry-sdk>=1.26.0,<2",
  "opentelemetry-exporter-otlp>=1.26.0,<2",
  "opentelemetry-instrumentation-fastapi>=0.47b0,<1",
  "opentelemetry-instrumentation-redis>=0.47b0,<1",
  "opentelemetry-instrumentation-psycopg>=0.47b0,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
